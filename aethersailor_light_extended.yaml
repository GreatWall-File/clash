# Aethersailor Custom_Clash_Full 精简扩展版 · Sub-Store 模板
# 基于原始 Full 模板重构：精简臃肿分组，扩展东南亚/南亚/中东国家分组
# 适配订阅节点分布：US(243) NL(147) FR(137) RO(129) JP(116) GB(67) KR(66) SG(61) HK(51) TW(25) DE(53) + 多国零星节点
# 优化：印度节点独立分组、更多国家分组

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 0.0.0.0:9090

# ── 规则集提供者（Aethersailor CDN）─────────────────────────
rule-providers:
  Custom_Direct_Domain:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs
    path: ./ruleset/Custom_Direct_Domain.mrs
    interval: 1800
  Custom_Direct_IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.mrs
    path: ./ruleset/Custom_Direct_IP.mrs
    interval: 28800
  Custom_Direct_Port:
    type: http
    behavior: classical
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_Port.yaml
    path: ./ruleset/Custom_Direct_Port.yaml
    interval: 28800
  Custom_Proxy_Domain:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs
    path: ./ruleset/Custom_Proxy_Domain.mrs
    interval: 28800
  Custom_Proxy_IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_IP.mrs
    path: ./ruleset/Custom_Proxy_IP.mrs
    interval: 28800
  Steam_CDN_Domain:
    type: http
    behavior: domain
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.mrs
    path: ./ruleset/Steam_CDN_Domain.mrs
    interval: 28800
  Steam_CDN_IP:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_IP.mrs
    path: ./ruleset/Steam_CDN_IP.mrs
    interval: 28800
  Nonstandard_Port_Direct:
    type: http
    behavior: classical
    format: yaml
    url: https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml
    path: ./ruleset/Nonstandard_Port_Direct.yaml
    interval: 28800

