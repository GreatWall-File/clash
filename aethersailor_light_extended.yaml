  - { name: ☁️ CF节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(CF|cloudflare|cloud\s?flare)' }

  - { name: 🌐 其他节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '' }   # 兜底：匹配其余未归类节点

  # ── 应用/服务分组 ─────────────────────────────────────────
