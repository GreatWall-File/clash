dns:
  enable: true
  listen: '0.0.0.0:1053'
  # 国内域名走本地 DNS
  nameserver:
    - 'https://223.5.5.5/dns-query'    # 阿里 DNS
    - 'https://dns.alidns.com/dns-query'
    - 'tls://223.5.5.5:853'
  fallback:
    - 'https://1.1.1.1/dns-query'     # Cloudflare（仅用于解析被规则匹配的域名）
    - 'https://8.8.8.8/dns-query'
  fallback-filter:
    geoip: false
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32

proxies:
  - { name: DIRECT, type: direct }

proxy-groups:
  # ── 主选择组 ──────────────────────────────────────────────
  - { name: 🚀 节点切换, type: select, proxies: [♻️ 自动选择, 🎯 全球直连,
    🇭🇰 港澳节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新加坡节点,
    🇹🇼 台湾节点, 🇺🇸 美国节点, 🇩🇪 德国节点, 🇬🇧 英国节点,
    🇫🇷 法国节点, 🇳🇱 荷兰节点, 🇨🇦 加拿大节点,
    🇦🇺 澳洲节点, 🇮🇳 印度节点, 🇦🇪 迪拜节点, 🇲🇽 墨西哥节点, 🇪🇸 西班牙节点,
    🇧🇷 巴西节点, ☁️ CF节点, 🌐 其他节点] }

  - { name: ♻️ 自动选择, type: url-test, proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '' }

  - { name: 🎯 全球直连, type: select, proxies: [DIRECT] }

  # ── 地区分组（按你订阅实际分布设计）────────────────────────
  - { name: 🇭🇰 港澳节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(港|🇭🇰|HKG|HKT|Hong\s?Kong|Kowloon|九龙|深港)' }

  - { name: 🇹🇼 台湾节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(台|🇹🇼|🇼🇸|TWN|TPE|Taiwan|ROC|新北|彰化|推特专线|Google\s?play)' }

  - { name: 🇯🇵 日本节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(日|🇯🇵|JPN|Japan|东京|大阪|川日|泉日|沪日|深日|埼玉|关西|NRT|HND|KIX|TYO|OSA)' }

  - { name: 🇰🇷 韩国节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(韩|🇰🇷|KOR|Korea|首尔|春川|ICN)' }

  - { name: 🇸🇬 新加坡节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(新|🇸🇬|SGA|Singapore|SIN|狮城|坡|AWS)' }

  - { name: 🇺🇸 美国节点, type: url-test,
      proxies: [DIRECT],
      url: https://cp.cloudflare.com/generate_204, interval: 300, tolerance: 50,
      filter: '(美|🇺🇸|USA|United\s?States|洛杉矶|Phoenix|凤凰城|圣何塞|硅谷|西雅图|纽约|芝加哥|达拉斯|亚特兰大|JFK|LAX|SFO|SEA|DFW|ORD|IAD)' }

  - { name: 🇩🇪 德国节点, type: url-test,
