[dns]
enable = true
listen = 0.0.0.0:1053
nameserver =
  https://223.5.5.5/dns-query
  https://dns.alidns.com/dns-query
  tls://223.5.5.5:853
fallback =
  https://1.1.1.1/dns-query
  https://8.8.8.8/dns-query
fallback-filter.geoip = false
fallback-filter.ipcidr =
  240.0.0.0/4
  0.0.0.0/32

